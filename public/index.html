<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deluxe Transfer</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--muted:#646b7d;--line:#e2e5ee;--accent:#4f46e5;--accent-ink:#fff;--soft:#eef0ff;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--ink:#eceef5;--muted:#9aa1b2;--line:#2a2f3d;--accent:#8b85ff;--accent-ink:#0f1117;--soft:#232647;--bad:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop strong{color:var(--ink);display:block;font-size:18px;margin-bottom:4px}
input[type=file]{display:none}
ul{list-style:none;padding:0;margin:16px 0 0}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li span:last-child{color:var(--muted);flex:none}
li a{color:var(--accent);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:16px}
.bar div{height:100%;width:0;background:var(--accent);transition:width .15s}
.code{font:700 40px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-align:center;margin:8px 0}
.link{display:flex;gap:8px;margin-top:8px}
.link input,.codein{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:inherit}
.codein{width:100%;text-align:center;font:700 28px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}
.link button{border:0;border-radius:10px;padding:0 16px;font:inherit;font-weight:600;background:var(--soft);color:var(--ink);cursor:pointer}
.muted{color:var(--muted);font-size:14px;text-align:center}
.err{color:var(--bad);margin-top:12px;text-align:center}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#account{flex:none;margin-top:2px}
.mail{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.mail h2{font-size:16px;margin:0 0 8px}
.mail input,.mail textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font:inherit;margin-bottom:8px}
.mail textarea{min-height:64px;resize:vertical}
.ok{color:#2e7d32;margin-top:8px;text-align:center}
@media (prefers-color-scheme:dark){.ok{color:#81c784}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>Deluxe Transfer</h1><div id="account"></div></header>
  <p class="sub">Send files with a code. Up to 100 MB, gone after 24 hours.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-send" aria-selected="true">Send</button>
    <button role="tab" id="tab-get" aria-selected="false">Receive</button>
  </div>

  <section id="send" class="card">
    <div id="pick">
      <label class="drop" id="drop">
        <strong>Choose files</strong>or drop them here
        <input type="file" id="file" multiple>
      </label>
      <ul id="chosen"></ul>
      <button class="btn" id="go" disabled>Send</button>
      <div class="bar" id="bar" hidden><div></div></div>
      <p class="muted" id="pct" hidden></p>
    </div>
    <div id="done" hidden>
      <p class="muted">Share this code</p>
      <div class="code" id="outcode"></div>
      <p class="muted">or this link</p>
      <div class="link"><input id="outlink" readonly><button id="copy">Copy</button></div>
      <button class="btn" id="share" hidden>Share…</button>
      <form class="mail" id="mailform">
        <h2>Send by Deluxe Mail</h2>
        <input id="mailto" type="text" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="name@deluxemail.com">
        <textarea id="note" maxlength="2000" placeholder="Message (optional)"></textarea>
        <button class="btn" id="mailbtn">Send by Deluxe Mail</button>
        <p class="ok" id="mailok" hidden></p>
        <p class="err" id="mailerr" hidden></p>
      </form>
      <button class="btn ghost" id="again">Send more files</button>
      <button class="btn danger" id="del">Delete now</button>
    </div>
    <p class="err" id="senderr" hidden></p>
  </section>

  <section id="get" class="card" hidden>
    <form id="lookup">
      <input class="codein" id="codein" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" value="">
      <button class="btn">Find files</button>
    </form>
    <div id="found" hidden>
      <ul id="files"></ul>
      <p class="muted" id="expires"></p>
    </div>
    <p class="err" id="geterr" hidden></p>
  </section>
</main>
<script src="https://deluxe-main.vercel.app/deluxe.js" data-app="transfer"></script>
<script type="module">
import { upload } from "/blob-upload.js";
const $ = id => document.getElementById(id);
const size = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : b < 1073741824 ? (b/1048576).toFixed(1) + " MB" : (b/1073741824).toFixed(2) + " GB";
const MAX_MB = 100, MAX = MAX_MB * 1048576;
let picked = [], current = null;

function tab(name){
  $("tab-send").setAttribute("aria-selected", name === "send");
  $("tab-get").setAttribute("aria-selected", name === "get");
  $("send").hidden = name !== "send";
  $("get").hidden = name !== "get";
}
$("tab-send").onclick = () => tab("send");
$("tab-get").onclick = () => { tab("get"); $("codein").focus(); };

function show(el, text){ el.textContent = text; el.hidden = !text; }
function li(left, right){
  const l = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
  if (left instanceof Node) a.append(left); else a.textContent = left;
  b.textContent = right; l.append(a, b); return l;
}

function choose(list){
  picked = [...picked, ...list];
  const total = picked.reduce((s, f) => s + f.size, 0);
  $("chosen").replaceChildren(...picked.map(f => li(f.name, size(f.size))));
  $("go").disabled = !picked.length || total > MAX;
  $("go").textContent = picked.length ? `Send ${picked.length} file${picked.length > 1 ? "s" : ""} (${size(total)})` : "Send";
  show($("senderr"), total > MAX ? `Too big: the limit is ${MAX_MB} MB.` : "");
}
$("file").onchange = e => { choose(e.target.files); e.target.value = ""; };
const drop = $("drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => choose(e.dataTransfer.files));

function cleanName(n){ return (n.replace(/[\/\\\x00-\x1f]/g, "_").trim().replace(/^\.+/, "") || "file").slice(0, 200); }
function randomDir(){ const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789"; return [...crypto.getRandomValues(new Uint8Array(24))].map(x => a[x % a.length]).join(""); }
async function api(path, opts = {}){
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || "Something went wrong. Try again.");
  return body;
}
function progress(p, text){
  $("bar").hidden = $("pct").hidden = p == null;
  if (p != null){ $("bar").firstElementChild.style.width = p + "%"; $("pct").textContent = text; }
}
$("go").onclick = async () => {
  $("go").disabled = true; show($("senderr"), "");
  const total = picked.reduce((s, f) => s + f.size, 0) || 1;
  let done = 0;
  try {
    progress(0, "Starting…");
    const { code, owner } = await api("/api/create");
    const used = new Set();
    for (const f of picked) {
      let name = cleanName(f.name), n = 2;
      const dot = name.lastIndexOf("."), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
      while (used.has(name.toLowerCase())) name = `${base} (${n++})${ext}`;
      used.add(name.toLowerCase());
      await upload(`t/${code}/${randomDir()}/${name}`, f, {
        access: "public",
        handleUploadUrl: "/api/upload",
        clientPayload: JSON.stringify({ code, owner }),
        multipart: f.size > 20 * 1048576,
        contentType: f.type || "application/octet-stream",
        onUploadProgress: e => { const p = Math.round((done + e.loaded) / total * 100); progress(Math.min(p, 99), `Uploading… ${Math.min(p, 99)}%`); },
      });
      done += f.size;
    }
    progress(100, "Finishing…");
    current = { ...(await api("/api/finish", { body: JSON.stringify({ code, owner }) })), owner };
    progress(null);
    showDone();
  } catch (e) {
    progress(null);
    show($("senderr"), e.message || "Upload failed. Try again.");
    $("go").disabled = false;
  }
};
const SAVED = "transfer.current";
function showDone(){
  try { sessionStorage.setItem(SAVED, JSON.stringify(current)); } catch {}
  $("outcode").textContent = current.code;
  $("outlink").value = current.link;
  $("pick").hidden = true; $("done").hidden = false;
  $("share").hidden = !navigator.share;
  show($("mailok"), ""); show($("mailerr"), "");
  mailButton();
}
const D = window.Deluxe;
const signedIn = () => !!(D && D.user());
function mailButton(){ $("mailbtn").textContent = signedIn() ? "Send by Deluxe Mail" : "Sign in with Deluxe Main to send"; }
if (D) { D.button($("account")); D.onChange(mailButton); D.ready.then(mailButton); }
$("mailform").onsubmit = async e => {
  e.preventDefault();
  show($("mailok"), ""); show($("mailerr"), "");
  if (!D) return show($("mailerr"), "Deluxe Main could not be reached. Try again in a moment.");
  if (!signedIn()) { D.signIn(); return; }  // comes back here; the transfer is kept in this tab
  const to = $("mailto").value.trim();
  if (!to) return show($("mailerr"), "Enter a Deluxe Mail address.");
  $("mailbtn").disabled = true;
  try {
    const r = await fetch("/api/share", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + D.token() },
      body: JSON.stringify({ code: current.code, owner: current.owner, to, note: $("note").value }) });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401 && body.code === "signin") { D.signIn(); return; }
    if (!r.ok) throw new Error(body.error || "Could not send that. Try again.");
    show($("mailok"), `Sent to ${body.to}`);
    $("mailto").value = ""; $("note").value = "";
  } catch (err) { show($("mailerr"), err.message); }
  $("mailbtn").disabled = false;
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("outlink").value); } catch { $("outlink").select(); document.execCommand("copy"); }
  $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1500);
};
$("share").onclick = () => navigator.share({ title: "Files for you", text: `Code: ${current.code}`, url: current.link }).catch(() => {});
function reset(){
  picked = []; current = null; choose([]);
  try { sessionStorage.removeItem(SAVED); } catch {}
  $("bar").firstElementChild.style.width = "0";
  $("pick").hidden = false; $("done").hidden = true;
}
$("again").onclick = reset;
$("del").onclick = async () => {
  if (!current || !confirm("Delete these files now? The code will stop working.")) return;
  const r = await fetch("/api/transfer?code=" + current.code, { method: "DELETE", headers: { "X-Owner": current.owner } });
  if (r.ok) reset(); else show($("senderr"), "Could not delete.");
};

$("codein").oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
async function find(code){
  show($("geterr"), ""); $("found").hidden = true;
  const r = await fetch("/api/transfer?code=" + encodeURIComponent(code));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { show($("geterr"), body.error || "Not found."); return; }
  $("files").replaceChildren(...body.files.map((f, i) => {
    const a = document.createElement("a");
    a.href = f.url; a.textContent = f.name; a.download = f.name;
    return li(a, size(f.size));
  }));
  const hrs = Math.max(0, (body.expires - Date.now()) / 3600000);
  $("expires").textContent = hrs >= 1 ? `Available for ${Math.floor(hrs)} more hour${Math.floor(hrs) === 1 ? "" : "s"}` : `Available for ${Math.ceil(hrs * 60)} more minutes`;
  $("found").hidden = false;
  if (location.pathname !== "/d/" + body.code) history.replaceState(null, "", "/d/" + body.code);
}
$("lookup").onsubmit = e => { e.preventDefault(); const c = $("codein").value.trim(); if (c.length === 6) find(c); else show($("geterr"), "Codes are 6 letters and numbers."); };

try {
  const saved = JSON.parse(sessionStorage.getItem(SAVED) || "null");
  if (saved && saved.code && saved.expires > Date.now() && location.pathname === "/") { current = saved; showDone(); }
} catch {}
const m = location.pathname.match(/^\/d\/([A-Za-z0-9]{6})\/?$/);
if (m) { tab("get"); $("codein").value = m[1].toUpperCase(); find(m[1].toUpperCase()); }
</script>
</body>
</html>
