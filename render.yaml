services:
  - type: web
    name: deluxe-transfer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 600
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MAX_MB
        value: "100"
      - key: EXPIRE_HOURS
        value: "24"
